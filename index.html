<!DOCTYPE html>
<html>
<head>
    <title>AI Spam Detector</title>
    <style>
        :root { --grad: linear-gradient(135deg, #89f7fe, #66a6ff); }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e3f2fd, #fce4ec); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 400px; text-align: center; transition: 0.3s; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--grad); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2rem; }
        .spam { color: #ff4757; } .ham { color: #2ed573; }
    </style>
</head>
<body>

    <div id="auth-section" class="card">
        <h2 id="auth-title">Login</h2>
        <input type="email" id="email" placeholder="Email (student@cse.com)">
        <input type="password" id="pass" placeholder="Password (password123)">
        <button onclick="handleAuth()">Continue</button>
    </div>

    <div id="detector-section" class="card hidden">
        <h2>📧 Spam Detector</h2>
        <p style="color: #666; font-size: 14px;">Calm & clean AI email checker</p>
        <textarea id="input-text" rows="5" placeholder="Paste your email content here..."></textarea>
        <button onclick="checkSpam()">🔍 Predict</button>
        <div id="result"></div>
    </div>

    <script>
        function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;

            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('detector-section').classList.remove('hidden');
                } else { alert(data.message); }
            });
        }

        function checkSpam() {
            const text = document.getElementById('input-text').value;
            const resDiv = document.getElementById('result');
            resDiv.innerText = "Processing...";

            fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text: text})
            })
            .then(res => res.json())
            .then(data => {
                resDiv.className = data.result.toLowerCase();
                resDiv.innerText = data.result === "Spam" ? "🚨 SPAM DETECTED" : "✅ SAFE EMAIL";
            });
        }
    </script>
</body>
</html>
